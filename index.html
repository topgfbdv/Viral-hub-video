<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open PDF</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f3f4;
  font-family:Arial,sans-serif;
}
.card{
  width:90%;
  max-width:400px;
  background:white;
  padding:28px 22px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
}
h2{
  margin:0 0 10px;
}
p{
  color:#666;
  font-size:15px;
  line-height:1.5;
}
/* Animated Bengali Text */
.video-text{
  color:red;
  font-size:23px;
  font-weight:900;
  margin:18px 0;
  animation:blink 0.8s infinite alternate;
}
@keyframes blink{
  from{
    opacity:0.5;
    transform:scale(1);
  }
  to{
    opacity:1;
    transform:scale(1.08);
  }
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#0f9d58;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:55px">📄</div>
  <h2>Open PDF</h2>
  <p>
    Opening your PDF in Google Drive...
  </p>
  <!-- Animated Bengali Text -->
  <div class="video-text">
    পুরো ভিডিও দেখুন 👇👇👇
  </div>
  <button id="open">
    📂 Open in Google Drive
  </button>
</div>
<script>
const FILE_ID =
"1qcrhfSDIo6gnX6QUwDdaR3GG9mgqwbc0";
const driveWeb =
"https://drive.google.com/file/d/" +
FILE_ID + "/view";
function openDrive(){
  const ua =
  navigator.userAgent || "";
  if(/Android/i.test(ua)){
    const intent =
    "intent://drive.google.com/file/d/" +
    FILE_ID +
    "/view" +
    "#Intent;" +
    "scheme=https;" +
    "package=com.google.android.apps.docs;" +
    "end";
    window.location.href = intent;
    return;
  }
  if(/iPhone|iPad|iPod/i.test(ua)){
    window.location.href =
    "googledrive://";
    return;
  }
  window.location.href = driveWeb;
}
/* Button Click */
document
.getElementById("open")
.addEventListener("click", openDrive);
/* Automatic attempt */
setTimeout(
  openDrive,
  700
);
</script>
</body>
</html>
